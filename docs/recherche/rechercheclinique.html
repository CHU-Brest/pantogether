<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte des régions — France</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8}
#map{height:100vh;width:100vw}
#panel{
  position:fixed;top:0;left:0;width:270px;height:100vh;
  background:#fff;padding:18px 16px;overflow-y:auto;
  z-index:2000;box-shadow:3px 0 12px rgba(0,0,0,.13);
  transition:left .3s;display:flex;flex-direction:column;gap:14px
}
#togglePanel{
  position:fixed;top:12px;left:12px;z-index:3000;
  background:#1a3a5c;color:#fff;border:none;
  padding:9px 13px;border-radius:8px;font-size:18px;
  cursor:pointer;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25)
}
@media(max-width:768px){
  #panel{left:-280px}
  #panel.open{left:0}
  #togglePanel{display:block}
}
.panel-title{font-size:1rem;font-weight:700;color:#1a2535;border-bottom:2px solid #e2e8f0;padding-bottom:10px}
.panel-title small{display:block;font-size:.72rem;color:#6b7a8d;font-weight:400;margin-top:2px}
.section-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6b7a8d;margin-top:4px}
.legende{display:flex;flex-direction:column;gap:4px}
.legende-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:8px;cursor:pointer;transition:background .15s;
  font-size:.83rem;text-decoration:none;color:#1a2535;border:2px solid transparent
}
.legende-item:hover{background:#f0f4f8}
.dot{width:16px;height:16px;border-radius:4px;flex-shrink:0;opacity:.85}
.legende-name{font-weight:600;line-height:1.3;flex:1;color:#1a2535}
.legende-arrow{font-size:.75rem;color:#aaa}
.drom-btns{display:flex;flex-wrap:wrap;gap:5px}
.drom-btn{
  flex:1;min-width:48%;padding:6px 8px;border:1px solid #d1d9e0;
  border-radius:6px;background:#f7fafc;cursor:pointer;font-size:.75rem;
  color:#1a2535;transition:background .15s
}
.drom-btn:hover{background:#e8f0f7}
.region-tooltip{
  background:rgba(26,37,53,.88)!important;color:#fff!important;
  border:none!important;border-radius:6px!important;
  padding:5px 11px!important;font-size:.8rem!important;font-weight:600!important;
  box-shadow:0 2px 8px rgba(0,0,0,.3)!important
}
.region-tooltip::before{display:none!important}
.leaflet-popup-content-wrapper{border-radius:10px!important;box-shadow:0 4px 20px rgba(0,0,0,.18)!important}
.popup-inner{padding:4px 2px;min-width:200px}
.popup-inner h4{font-size:1rem;color:#1a2535;margin-bottom:3px}
.popup-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.72rem;font-weight:700;color:#fff;margin-bottom:8px}
.popup-link{
  display:block;text-align:center;margin-top:10px;padding:8px 14px;
  border-radius:7px;color:#fff!important;text-decoration:none!important;
  font-weight:600;font-size:.85rem;transition:opacity .15s
}
.popup-link:hover{opacity:.85}
.popup-no-link{font-size:.75rem;color:#aaa;text-align:center;margin-top:6px;font-style:italic}
</style>
</head>
<body>
<button id="togglePanel">&#9776;</button>
<div id="panel">
  <div class="panel-title">
    Carte des régions
    <small>Cliquez sur une région pour accéder à son espace</small>
  </div>
  <div>
    <div class="section-label">Groupes régionaux</div>
    <div class="legende" id="legendeList"></div>
  </div>
  <div>
    <div class="section-label">Navigation Outre-Mer</div>
    <div class="drom-btns">
      <button class="drom-btn" onclick="zoomVers('guadeloupe')">&#127796; Guadeloupe</button>
      <button class="drom-btn" onclick="zoomVers('martinique')">&#127796; Martinique</button>
      <button class="drom-btn" onclick="zoomVers('guyane')">&#127807; Guyane</button>
      <button class="drom-btn" onclick="zoomVers('reunion')">&#9968; La Réunion</button>
      <button class="drom-btn" onclick="zoomVers('mayotte')">&#127965; Mayotte</button>
      <button class="drom-btn" style="min-width:100%" onclick="zoomVers('metropole')">&#8617; Métropole</button>
    </div>
  </div>
</div>

  attribution:'&copy; OpenStreetMap &copy; CARTO',
  subdomains:'abcd',maxZoom:19
}).addTo(map);

function styleFor(groupe){
  return {
    fillColor: groupe ? groupe.couleur : '#888',
    fillOpacity: 0.50,
    color: '#fff',
    weight: 2.5,
    opacity: 1
  };
}

L.geoJSON(regionsGeoJSON,{
  style: function(feature){
    return styleFor(GROUPES[feature.properties.groupe]);
  },
  onEachFeature: function(feature, layer){
    var g = GROUPES[feature.properties.groupe];
    var nom = feature.properties.nom;
    layer.bindTooltip(nom,{className:'region-tooltip',sticky:true,direction:'top'});
    layer.on('mouseover',function(){
      layer.setStyle({fillOpacity:0.80,weight:3.5});
      layer.bringToFront();
    });
    layer.on('mouseout',function(){
      layer.setStyle({fillOpacity:0.50,weight:2.5});
    });
    layer.on('click',function(e){
      var hasLink = g && g.lien && g.lien.indexOf('LIEN_') !== 0;
      var linkHtml = hasLink
        ? '<a class="popup-link" href="'+g.lien+'" style="background:'+g.couleur+'">Accéder à l\'espace &rarr;</a>'
        : '<p class="popup-no-link">Lien à configurer dans le code</p>';
      L.popup({maxWidth:300})
        .setLatLng(e.latlng)
        .setContent('<div class="popup-inner"><h4>'+nom+'</h4><span class="popup-badge" style="background:'+(g?g.couleur:'#888')+'">'+(g?g.label:'')+'</span>'+linkHtml+'</div>')
        .openOn(map);
    });
  }
}).addTo(map);

// DROM markers

  {nom:"Guadeloupe", lat:16.26, lng:-61.55},
  {nom:"Martinique", lat:14.64, lng:-61.02},
  {nom:"Guyane",     lat: 3.94, lng:-53.13},
  {nom:"La Réunion", lat:-21.11,lng: 55.53},
  {nom:"Mayotte",    lat:-12.84,lng: 45.15}
];
var g7 = GROUPES[7];
droms.forEach(function(d){
  var icon = L.divIcon({
    html:'<div style="background:'+g7.couleur+';width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)"></div>',
    className:'',iconSize:[18,18],iconAnchor:[9,9]
  });
  var marker = L.marker([d.lat,d.lng],{icon:icon})
    .bindTooltip(d.nom,{className:'region-tooltip',direction:'top'})
    .addTo(map);
  marker.on('click',function(e){
    var hasLink = g7.lien && g7.lien.indexOf('LIEN_') !== 0;
    var linkHtml = hasLink
      ? '<a class="popup-link" href="'+g7.lien+'" style="background:'+g7.couleur+'">Accéder à l\'espace &rarr;</a>'
      : '<p class="popup-no-link">Lien à configurer dans le code</p>';
    L.popup({maxWidth:280})
      .setLatLng(e.latlng)
      .setContent('<div class="popup-inner"><h4>'+d.nom+'</h4><span class="popup-badge" style="background:'+g7.couleur+'">DROM</span>'+linkHtml+'</div>')
      .openOn(map);
  });
});

// Légende
var legendeList = document.getElementById('legendeList');
Object.keys(GROUPES).forEach(function(id){
  var g = GROUPES[id];
  var hasLink = g.lien && g.lien.indexOf('LIEN_') !== 0;
  var item = document.createElement('a');
  item.className = 'legende-item';
  item.href = hasLink ? g.lien : '#';
  if(!hasLink){ item.onclick = function(e){e.preventDefault();}; }
  item.innerHTML = '<span class="dot" style="background:'+g.couleur+'"></span>'
    +'<span class="legende-name">'+g.label+'</span>'
    +'<span class="legende-arrow">'+(hasLink?'&rarr;':'&#x270e;')+'</span>';
  legendeList.appendChild(item);
});

}
