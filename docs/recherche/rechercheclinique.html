<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte des regions France</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif}
#map{height:100vh;width:100vw}
#panel{position:fixed;top:0;left:0;width:265px;height:100vh;background:#fff;
  padding:16px 14px;overflow-y:auto;z-index:2000;
  box-shadow:3px 0 12px rgba(0,0,0,.13);transition:left .3s;
  display:flex;flex-direction:column;gap:12px}
#toggle{position:fixed;top:12px;left:12px;z-index:3000;background:#1a3a5c;
  color:#fff;border:none;padding:9px 13px;border-radius:8px;
  font-size:18px;cursor:pointer;display:none;
  box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media(max-width:768px){
  #panel{left:-270px}
  #panel.open{left:0}
  #toggle{display:block}}
.ptitle{font-size:.95rem;font-weight:700;color:#1a2535;
  border-bottom:2px solid #e2e8f0;padding-bottom:10px}
.ptitle small{display:block;font-size:.7rem;color:#6b7a8d;
  font-weight:400;margin-top:2px}
.slabel{font-size:.67rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:#6b7a8d}
.llist{display:flex;flex-direction:column;gap:3px}
.litem{display:flex;align-items:center;gap:9px;padding:7px 9px;
  border-radius:7px;cursor:pointer;font-size:.82rem;
  text-decoration:none;color:#1a2535;border:2px solid transparent;
  transition:background .15s}
.litem:hover{background:#f0f4f8}
.ldot{width:15px;height:15px;border-radius:3px;flex-shrink:0}
.lname{font-weight:600;line-height:1.3;flex:1;color:#1a2535}
.larr{font-size:.74rem;color:#bbb}
.dbtns{display:flex;flex-wrap:wrap;gap:5px}
.dbtn{flex:1;min-width:47%;padding:6px 7px;border:1px solid #d1d9e0;
  border-radius:6px;background:#f7fafc;cursor:pointer;
  font-size:.73rem;color:#1a2535;transition:background .15s}
.dbtn:hover{background:#e2ecf5}
.rtt{background:rgba(26,37,53,.88)!important;color:#fff!important;
  border:none!important;border-radius:6px!important;
  padding:5px 10px!important;font-size:.79rem!important;
  font-weight:600!important}
.rtt::before{display:none!important}
.leaflet-popup-content-wrapper{border-radius:10px!important;
  box-shadow:0 4px 20px rgba(0,0,0,.18)!important}
.pi{padding:4px 2px;min-width:190px}
.pi h4{font-size:.97rem;color:#1a2535;margin-bottom:3px}
.pbadge{display:inline-block;padding:2px 10px;border-radius:12px;
  font-size:.71rem;font-weight:700;color:#fff;margin-bottom:8px}
.plink{display:block;text-align:center;margin-top:10px;padding:8px 14px;
  border-radius:7px;color:#fff!important;text-decoration:none!important;
  font-weight:600;font-size:.83rem;transition:opacity .15s}
.plink:hover{opacity:.82}
.pnl{font-size:.74rem;color:#bbb;text-align:center;margin-top:6px;font-style:italic}
</style>
</head>
<body>
<button id="toggle">&#9776;</button>
<div id="panel">
  <div class="ptitle">Carte des regions<small>Cliquez pour acceder a votre espace</small></div>
  <div><div class="slabel" style="margin-bottom:6px">Groupes regionaux</div>
  <div class="llist" id="llist"></div></div>
  <div><div class="slabel" style="margin-bottom:6px">Outre-Mer</div>
  <div class="dbtns">
    <button class="dbtn" id="b1">Guadeloupe</button>
    <button class="dbtn" id="b2">Martinique</button>
    <button class="dbtn" id="b3">Guyane</button>
    <button class="dbtn" id="b4">La Reunion</button>
    <button class="dbtn" id="b5">Mayotte</button>
    <button class="dbtn" id="b0" style="min-width:100%">Retour Metropole</button>
  </div></div>
</div>
<div id="map"></div>

var map=L.map("map").setView([46.6,2.5],6);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
  attribution:"&copy; OpenStreetMap &copy; CARTO",subdomains:"abcd",maxZoom:19
}).addTo(map);

function sty(f){
  var g=G[f.properties.groupe];
  return{fillColor:g?g.c:"#888",fillOpacity:.50,color:"#fff",weight:2.5,opacity:1};
}
function popup(nom,groupe,latlng){
  var g=G[groupe];
  var ok=g&&g.u&&g.u.indexOf("LIEN_")!==0;
  var btn=ok
    ? "<a class=\"plink\" href=\""+g.u+"\" style=\"background:"+g.c+"\">Acceder a l'espace &rarr;</a>"
    : "<p class=\"pnl\">Lien a configurer dans le code</p>";
  L.popup({maxWidth:300}).setLatLng(latlng)
    .setContent("<div class=\"pi\"><h4>"+nom+"</h4>"
      +"<span class=\"pbadge\" style=\"background:"+(g?g.c:"#888")+"\">"+(g?g.l:"")+"</span>"
      +btn+"</div>").openOn(map);
}

L.geoJSON(GJ,{
  style:sty,
  onEachFeature:function(f,l){
    var nom=f.properties.nom,gr=f.properties.groupe;
    l.bindTooltip(nom,{className:"rtt",sticky:true,direction:"top"});
    l.on("mouseover",function(){l.setStyle({fillOpacity:.78,weight:3.5});l.bringToFront();});
    l.on("mouseout", function(){l.setStyle({fillOpacity:.50,weight:2.5});});
    l.on("click",   function(e){popup(nom,gr,e.latlng);});
  }
}).addTo(map);

var droms=[
  {n:"Guadeloupe",a:16.26,o:-61.55,k:"b1"},
  {n:"Martinique", a:14.64,o:-61.02,k:"b2"},
  {n:"Guyane",     a: 3.94,o:-53.13,k:"b3"},
  {n:"La Reunion", a:-21.11,o:55.53, k:"b4"},
  {n:"Mayotte",    a:-12.84,o:45.15, k:"b5"}
];
var zooms={b0:[46.6,2.5,6],b1:[16.26,-61.55,9],b2:[14.64,-61.02,10],
           b3:[3.94,-53.13,7],b4:[-21.11,55.53,10],b5:[-12.84,45.15,11]};

droms.forEach(function(d){
  var ic=L.divIcon({
    html:"<div style=\"background:#2a9a7a;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)\"></div>",
    className:"",iconSize:[18,18],iconAnchor:[9,9]
  });
  L.marker([d.a,d.o],{icon:ic})
    .bindTooltip(d.n,{className:"rtt",direction:"top"})
    .on("click",function(e){popup(d.n,7,e.latlng);})
    .addTo(map);
});

["b0","b1","b2","b3","b4","b5"].forEach(function(id){
  var el=document.getElementById(id);
  if(el){ el.addEventListener("click",function(){
    var z=zooms[id];map.setView([z[0],z[1]],z[2]);
  });}
});

var ll=document.getElementById("llist");
[1,2,3,4,5,6,7].forEach(function(id){
  var g=G[id];
  var ok=g.u&&g.u.indexOf("LIEN_")!==0;
  var a=document.createElement("a");
  a.className="litem";
  a.href=ok?g.u:"#";
  if(!ok){a.addEventListener("click",function(e){e.preventDefault();});}
  a.innerHTML="<span class=\"ldot\" style=\"background:"+g.c+"\"></span>"
    +"<span class=\"lname\">"+g.l+"</span>"
    +"<span class=\"larr\">"+(ok?"&rarr;":"&#x270e;")+"</span>";
  ll.appendChild(a);
});

document.getElementById("toggle").addEventListener("click",function(){
  document.getElementById("panel").classList.toggle("open");
});
</script>
</body>
</html>
