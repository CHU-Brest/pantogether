<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte des régions — France</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; }
  #map { height: 100vh; width: 100vw; }

  /* ─── Panneau latéral ─── */
  #panel {
    position: fixed; top: 0; left: 0;
    width: 270px; height: 100vh;
    background: #ffffff;
    padding: 18px 16px;
    overflow-y: auto;
    z-index: 2000;
    box-shadow: 3px 0 12px rgba(0,0,0,.13);
    transition: left 0.3s;
    display: flex; flex-direction: column; gap: 14px;
  }
  #togglePanel {
    position: fixed; top: 12px; left: 12px;
    z-index: 3000; background: #1a3a5c; color: white;
    border: none; padding: 9px 13px; border-radius: 8px;
    font-size: 18px; cursor: pointer; display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  @media(max-width: 768px) {
    #panel { left: -280px; }
    #panel.open { left: 0; }
    #togglePanel { display: block; }
  }

  .panel-title {
    font-size: 1rem; font-weight: 700; color: #1a2535;
    border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;
  }
  .panel-title small { display:block; font-size: 0.72rem; color: #6b7a8d; font-weight: 400; margin-top: 2px; }

  /* ─── Légende ─── */
  .legende { display: flex; flex-direction: column; gap: 4px; }
  .legende-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    transition: background 0.15s; font-size: 0.83rem;
    text-decoration: none; color: #1a2535;
    border: 2px solid transparent;
  }
  .legende-item:hover { background: #f0f4f8; }
  .legende-item.active { border-color: currentColor; background: #f7fafc; }
  .dot {
    width: 16px; height: 16px; border-radius: 4px;
    flex-shrink: 0; opacity: 0.85;
  }
  .legende-name { font-weight: 600; line-height: 1.3; flex: 1; }
  .legende-sub { font-size: 0.7rem; color: #6b7a8d; }
  .legende-arrow { font-size: 0.75rem; color: #aaa; }

  /* ─── Navigation DROM ─── */
  .section-label {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #6b7a8d; margin-top: 4px;
  }
  .drom-btns { display: flex; flex-wrap: wrap; gap: 5px; }
  .drom-btn {
    flex: 1; min-width: 48%; padding: 6px 8px;
    border: 1px solid #d1d9e0; border-radius: 6px;
    background: #f7fafc; cursor: pointer; font-size: 0.75rem;
    color: #1a2535; transition: background 0.15s;
  }
  .drom-btn:hover { background: #e8f0f7; }

  /* ─── Tooltip Leaflet ─── */
  .region-tooltip {
    background: rgba(26,37,53,0.88); color: #fff;
    border: none; border-radius: 6px;
    padding: 5px 11px; font-size: 0.8rem; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .region-tooltip::before { display: none; }

  /* ─── Popup ─── */
  .leaflet-popup-content-wrapper {
    border-radius: 10px !important;
    box-shadow: 0 4px 20px rgba(0,0,0,.18) !important;
  }
  .popup-inner { padding: 4px 2px; min-width: 200px; }
  .popup-inner h4 { font-size: 1rem; color: #1a2535; margin-bottom: 3px; }
  .popup-badge {
    display: inline-block; padding: 2px 10px; border-radius: 12px;
    font-size: 0.72rem; font-weight: 700; color: #fff; margin-bottom: 8px;
  }
  .popup-inner a {
    display: block; text-align: center; margin-top: 10px;
    padding: 8px 14px; border-radius: 7px; color: #fff;
    text-decoration: none; font-weight: 600; font-size: 0.85rem;
    transition: opacity 0.15s;
  }
  .popup-inner a:hover { opacity: 0.85; }
  .popup-no-link { font-size: 0.75rem; color: #aaa; text-align: center; margin-top: 6px; font-style: italic; }
</style>
</head>
<body>

<button id="togglePanel">☰</button>

<div id="panel">
  <div class="panel-title">
    Carte des régions
    <small>Cliquez sur une région pour accéder à son espace</small>
  </div>

  <div>
    <div class="section-label">Groupes régionaux</div>
    <div class="legende" id="legendeList"></div>
  </div>

  <div>
    <div class="section-label">Navigation Outre-Mer</div>
    <div class="drom-btns">
      <button class="drom-btn" onclick="zoomVers('guadeloupe')"> Guadeloupe</button>
      <button class="drom-btn" onclick="zoomVers('martinique')"> Martinique</button>
      <button class="drom-btn" onclick="zoomVers('guyane')"> Guyane</button>
      <button class="drom-btn" onclick="zoomVers('reunion')"> La Réunion</button>
      <button class="drom-btn" onclick="zoomVers('mayotte')"> Mayotte</button>
      <button class="drom-btn" onclick="zoomVers('metropole')" style="min-width:100%">↩ Métropole</button>
    </div>
  </div>
</div>

<div id="map"></div>

//  CARTE LEAFLET

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap contributors © CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// Couche GeoJSON avec coloration par groupe
L.geoJSON(regionsGeoJSON, {
  style: function(feature) {
    const g = GROUPES[feature.properties.groupe];
    return {
      fillColor: g ? g.couleur : '#888',
      fillOpacity: 0.55,
      color: '#fff',
      weight: 2.5,
      opacity: 1
    };
  },
  onEachFeature: function(feature, layer) {
    const g = GROUPES[feature.properties.groupe];
    const nom = feature.properties.nom;

    // Tooltip survol
    layer.bindTooltip(nom, {
      className: 'region-tooltip',
      sticky: true,
      direction: 'top'
    });

    // Hover
    layer.on('mouseover', function() {
      layer.setStyle({ fillOpacity: 0.82, weight: 3.5 });
      layer.bringToFront();
    });
    layer.on('mouseout', function() {
      layer.setStyle({ fillOpacity: 0.55, weight: 2.5 });
    });

    // Clic → popup avec lien
    layer.on('click', function(e) {
      const hasLink = g && g.lien && !g.lien.startsWith('LIEN_');
      const linkHtml = hasLink
        ? `<a href="${g.lien}" style="background:${g.couleur}">Accéder à l'espace →</a>`
        : `<p class="popup-no-link">Lien à configurer dans le code</p>`;

      L.popup({ maxWidth: 300 })
        .setLatLng(e.latlng)
        .setContent(`
          <div class="popup-inner">
            <h4>${nom}</h4>
            <span class="popup-badge" style="background:${g ? g.couleur : '#888'}">${g ? g.label : 'N/A'}</span>
            ${linkHtml}
          </div>`)
        .openOn(map);
    });
  }
}).addTo(map);

// ══════════════════════════════════════════════════════
//  DROM — marqueurs cliquables
// ══════════════════════════════════════════════════════
const droms = [
  { nom: "Guadeloupe",   lat: 16.26,   lng: -61.55, key: "guadeloupe"  },
  { nom: "Martinique",   lat: 14.64,   lng: -61.02, key: "martinique"  },
  { nom: "Guyane",       lat:  3.94,   lng: -53.13, key: "guyane"      },
  { nom: "La Réunion",   lat: -21.11,  lng:  55.53, key: "reunion"     },
  { nom: "Mayotte",      lat: -12.84,  lng:  45.15, key: "mayotte"     }
];

const g7 = GROUPES[7];
droms.forEach(d => {
  const icon = L.divIcon({
    html: `<div style="background:${g7.couleur};width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)"></div>`,
    className: '', iconSize: [18,18], iconAnchor: [9,9]
  });
  const marker = L.marker([d.lat, d.lng], { icon })
    .bindTooltip(d.nom, { className: 'region-tooltip', direction: 'top' })
    .addTo(map);

  marker.on('click', function(e) {
    const hasLink = g7.lien && !g7.lien.startsWith('LIEN_');
    const linkHtml = hasLink
      ? `<a href="${g7.lien}" style="background:${g7.couleur}">Accéder à l'espace →</a>`
      : `<p class="popup-no-link">Lien à configurer dans le code</p>`;
    L.popup({ maxWidth: 280 })
      .setLatLng(e.latlng)
      .setContent(`<div class="popup-inner"><h4>${d.nom}</h4><span class="popup-badge" style="background:${g7.couleur}">DROM</span>${linkHtml}</div>`)
      .openOn(map);
  });
});

// ══════════════════════════════════════════════════════
//  LÉGENDE dynamique
// ══════════════════════════════════════════════════════
const legendeList = document.getElementById('legendeList');
Object.entries(GROUPES).forEach(([id, g]) => {
  const item = document.createElement('a');
  item.className = 'legende-item';
  item.style.color = g.couleur;
  const hasLink = g.lien && !g.lien.startsWith('LIEN_');
  item.href = hasLink ? g.lien : '#';
  if (!hasLink) item.onclick = e => { e.preventDefault(); };
  item.innerHTML = `
    <span class="dot" style="background:${g.couleur}"></span>
    <span class="legende-name" style="color:#1a2535">${g.label}</span>
    <span class="legende-arrow">${hasLink ? '→' : '✎'}</span>
  `;
  legendeList.appendChild(item);
});

// ══════════════════════════════════════════════════════
//  NAVIGATION ZOOM
// ══════════════════════════════════════════════════════
function zoomVers(zone) {
  const coords = {
    metropole:  [46.6,    2.5,    6 ],
    guadeloupe: [16.26,  -61.55,  9 ],
    martinique: [14.64,  -61.02,  10],
    guyane:     [ 3.94,  -53.13,  7 ],
    reunion:    [-21.11,  55.53,  10],
    mayotte:    [-12.84,  45.15,  11]
  };
  const [lat, lng, z] = coords[zone];
  map.setView([lat, lng], z);
}

document.getElementById('togglePanel').onclick = () =>
  document.getElementById('panel').classList.toggle('open');
</script>
</body>
</html>
