<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Répertoires régionaux des essais cliniques</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif}
#map{height:100vh;width:100vw}
#panel{
  position:fixed;top:0;left:0;width:265px;height:100vh;background:#fff;
  padding:16px 14px;overflow-y:auto;z-index:2000;
  box-shadow:3px 0 12px rgba(0,0,0,.13);transition:left .3s;
  display:flex;flex-direction:column;gap:12px
}
#toggle{
  position:fixed;top:12px;left:12px;z-index:3000;background:#1a3a5c;
  color:#fff;border:none;padding:9px 13px;border-radius:8px;
  font-size:18px;cursor:pointer;display:none;
  box-shadow:0 2px 8px rgba(0,0,0,.25)
}
@media(max-width:768px){
  #panel{left:-270px}
  #panel.open{left:0}
  #toggle{display:block}
}
.ptitle{font-size:.95rem;font-weight:700;color:#1a2535;border-bottom:2px solid #e2e8f0;padding-bottom:10px}
.ptitle small{display:block;font-size:.7rem;color:#6b7a8d;font-weight:400;margin-top:2px}
.slabel{font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6b7a8d;margin-bottom:6px}
.llist{display:flex;flex-direction:column;gap:3px}
.litem{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;
  cursor:pointer;font-size:.82rem;text-decoration:none;color:#1a2535;
  border:2px solid transparent;transition:background .15s
}
.litem:hover{background:#f0f4f8}
.ldot{width:15px;height:15px;border-radius:3px;flex-shrink:0}
.lname{font-weight:600;line-height:1.3;flex:1;color:#1a2535}
.larr{font-size:.74rem;color:#bbb}
.dbtns{display:flex;flex-wrap:wrap;gap:5px}
.dbtn{
  flex:1;min-width:47%;padding:6px 7px;border:1px solid #d1d9e0;
  border-radius:6px;background:#f7fafc;cursor:pointer;
  font-size:.73rem;color:#1a2535;transition:background .15s
}
.dbtn:hover{background:#e2ecf5}
.rtt{
  background:rgba(26,37,53,.88)!important;color:#fff!important;
  border:none!important;border-radius:6px!important;
  padding:5px 10px!important;font-size:.79rem!important;font-weight:600!important
}
.rtt::before{display:none!important}
.leaflet-popup-content-wrapper{border-radius:10px!important;box-shadow:0 4px 20px rgba(0,0,0,.18)!important}
.pi{padding:4px 2px;min-width:190px}
.pi h4{font-size:.97rem;color:#1a2535;margin-bottom:3px}
.pbadge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.71rem;font-weight:700;color:#fff;margin-bottom:8px}
.plink{
  display:block;text-align:center;margin-top:10px;padding:8px 14px;
  border-radius:7px;color:#fff!important;text-decoration:none!important;
  font-weight:600;font-size:.83rem;transition:opacity .15s
}
.plink:hover{opacity:.82}
.pnl{font-size:.74rem;color:#bbb;text-align:center;margin-top:6px;font-style:italic}
#loading{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:white;padding:20px 30px;border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);font-size:.9rem;color:#1a2535;
  z-index:9999;display:flex;align-items:center;gap:10px
}
.spinner{width:20px;height:20px;border:3px solid #e2e8f0;
  border-top-color:#2D6A9F;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div> Chargement de la carte...</div>

<button id="toggle">&#9776;</button>

<div id="panel">
  <div class="ptitle">
    <a href="../ressources/recommandations/" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#2c3e50;text-decoration:none;margin-bottom:10px">← Retour</a>  <br>       
    Répertoires régionaux des essais cliniques
    <small>Cliquez sur les régions pour acceder aux répertoires</small>
  </div>
  <div>
    <div class="slabel">Groupes regionaux</div>
    <div class="llist" id="llist"></div>
  </div>
  <div>
    <div class="slabel">Outre-Mer</div>
    <div class="dbtns">
      <button class="dbtn" id="b1">Guadeloupe</button>
      <button class="dbtn" id="b2">Martinique</button>
      <button class="dbtn" id="b3">Guyane</button>
      <button class="dbtn" id="b4">La Reunion</button>
      <button class="dbtn" id="b5">Mayotte</button>
      <button class="dbtn" id="b0" style="min-width:100%">Retour Metropole</button>
    </div>
  </div>
</div>

<div id="map"></div>

<script>
// ================================================================
//  CONFIGURATION — remplacez les LIEN_... par vos URLs
// ================================================================
var G = {
  "Auvergne-Rhône-Alpes":           {groupe:1, lien:"https://ressources-aura.fr/plateforme/recherche-clinique/annuaire/essais-cliniques"},
  "Bourgogne-Franche-Comté":        {groupe:2, lien:"https://hector-essais-cliniques.fr/"},
  "Grand Est":                       {groupe:2, lien:"https://hector-essais-cliniques.fr/"},
  "Centre-Val de Loire":             {groupe:3, lien:"https://oncocentre.org/professionnels/recherche-clinique/repertoire-des-essais-cliniques/"},
  "Île-de-France":                   {groupe:4, lien:"https://essaisclic.girci-idf.fr/"},
  "Hauts-de-France":                 {groupe:5, lien:"https://archimaid.fr/"},
  "Normandie":                       {groupe:5, lien:"https://archimaid.fr/"},
  "Pays de la Loire":                {groupe:5, lien:"https://archimaid.fr/"},
  "Occitanie":                       {groupe:7, lien:"https://onco-occitanie.fr/nos-thematiques/par-traitement/essais-cliniques-en-occitanie/"},
  "Provence-Alpes-Côte d'Azur":     {groupe:6, lien:"https://www.oncopacacorse.org/repertoire-essais-cliniques/"},
  "Corse":                           {groupe:6, lien:"https://www.oncopacacorse.org/repertoire-essais-cliniques/"}

};

var GROUPES = {
  1:{label:"Auvergne-Rhône-Alpes, Annuaire OncoAURA",                         couleur:"#628AF5"},
  2:{label:"Bourgogne-FC et Grand Est, H.E.C.T.O.R",                    couleur:"#3a8c6e"},
  3:{label:"Centre-Val de Loire, Annauire OncoCentre",         couleur:"#c5792a"},
  4:{label:"Ile-de-France, Essais'Clic",                                couleur:"#9b3a7a"},
  5:{label:"Hauts-de-France / Normandie / PDL, ARCHIMAID", couleur:"#4a7ab5"},
  6:{label:"PACA / Corse, Annuaire OncoPACACorse",                     couleur:"#c94040"},
  7:{label:"Occitanie, Annuaire OncoOccitanie",                                         couleur:"#A1E8B3"}
};

// ================================================================
//  CARTE — tuiles OSM en francais
// ================================================================
var map = L.map("map").setView([46.6, 2.5], 6);

L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors",
  subdomains: "abc",
  maxZoom: 20
}).addTo(map);

var GEOJSON_URL = "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/regions-version-simplifiee.geojson";

function getCouleur(nom) {
  var r = G[nom];
  if (!r) return "#888888";
  var grp = GROUPES[r.groupe];
  return grp ? grp.couleur : "#888888";
}

function getLien(nom) {
  var r = G[nom];
  return r ? r.lien : "";
}

function getGroupe(nom) {
  var r = G[nom];
  return r ? r.groupe : 0;
}

fetch(GEOJSON_URL)
  .then(function(resp) { return resp.json(); })
  .then(function(data) {
    L.geoJSON(data, {
      style: function(feature) {
        var nom = feature.properties.nom;
        return {
          fillColor:   getCouleur(nom),
          fillOpacity: 0.50,
          color:       "#ffffff",
          weight:      2,
          opacity:     1
        };
      },
      onEachFeature: function(feature, layer) {
        var nom     = feature.properties.nom;
        var couleur = getCouleur(nom);
        var grpId   = getGroupe(nom);
        var grp     = GROUPES[grpId];

        layer.bindTooltip(nom, {className:"rtt", sticky:true, direction:"top"});

        layer.on("mouseover", function() {
          layer.setStyle({fillOpacity:0.80, weight:3});
          layer.bringToFront();
        });
        layer.on("mouseout", function() {
          layer.setStyle({fillOpacity:0.50, weight:2});
        });
        layer.on("click", function(e) {
          var lien    = getLien(nom);
          var hasLink = lien && lien.indexOf("LIEN_") !== 0;
          var btnHtml = hasLink
            ? '<a class="plink" href="' + lien + '" style="background:' + couleur + '">Accéder à l\'annuaire &rarr;</a>'
            : '<p class="pnl"></p>';
          L.popup({maxWidth:300})
            .setLatLng(e.latlng)
            .setContent(
              '<div class="pi">'
              + '<h4>' + nom + '</h4>'
              + '<span class="pbadge" style="background:' + couleur + '">'
              + (grp ? grp.label : "") + '</span>'
              + btnHtml + '</div>'
            )
            .openOn(map);
        });
      }
    }).addTo(map);

    document.getElementById("loading").style.display = "none";
  })
  .catch(function(err) {
    document.getElementById("loading").innerHTML = "Erreur de chargement. Vérifiez votre connexion.";
    console.error(err);
  });

// ================================================================
//  DROM markers
// ================================================================
var droms = [
  {n:"Guadeloupe", a:16.26,  o:-61.55},
  {n:"Martinique", a:14.64,  o:-61.02},
  {n:"Guyane",     a: 3.94,  o:-53.13},
  {n:"La Reunion", a:-21.11, o: 55.53},
  {n:"Mayotte",    a:-12.84, o: 45.15}
];

droms.forEach(function(d) {
  var ic = L.divIcon({
    html: '<div style="background:#2a9a7a;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)"></div>',
    className: "", iconSize:[18,18], iconAnchor:[9,9]
  });
  L.marker([d.a, d.o], {icon:ic})
    .bindTooltip(d.n, {className:"rtt", direction:"top"})
    .on("click", function(e) {
      var lien    = "LIEN_DROM";
      var hasLink = lien.indexOf("LIEN_") !== 0;
      var btnHtml = hasLink
        ? '<a class="plink" href="' + lien + '" style="background:#2a9a7a">Accéder à l\'annuaire &rarr;</a>'
        : '<p class="pnl"></p>';
      L.popup({maxWidth:280})
        .setLatLng(e.latlng)
        .setContent(
          '<div class="pi"><h4>' + d.n + '</h4>'
          + '<span class="pbadge" style="background:#2a9a7a">DROM</span>'
          + btnHtml + '</div>'
        )
        .openOn(map);
    })
    .addTo(map);
});

// ================================================================
//  LEGENDE
// ================================================================
var ll = document.getElementById("llist");
[1,2,3,4,5,6,7].forEach(function(id) {
  var g = GROUPES[id];
  var a = document.createElement("a");
  a.className = "litem";
  a.href = "#";
  a.addEventListener("click", function(e) { e.preventDefault(); });
  a.innerHTML = '<span class="ldot" style="background:' + g.couleur + '"></span>'
    + '<span class="lname">' + g.label + '</span>'
    + '<span class="larr">&#x270e;</span>';
  ll.appendChild(a);
});

// ================================================================
//  NAVIGATION ZOOM
// ================================================================
var zooms = {
  b0:[46.6,    2.5,    6],
  b1:[16.26,  -61.55,  9],
  b2:[14.64,  -61.02, 10],
  b3:[ 3.94,  -53.13,  7],
  b4:[-21.11,  55.53, 10],
  b5:[-12.84,  45.15, 11]
};
["b0","b1","b2","b3","b4","b5"].forEach(function(id) {
  var el = document.getElementById(id);
  if (el) {
    el.addEventListener("click", function() {
      var z = zooms[id];
      map.setView([z[0],z[1]], z[2]);
    });
  }
});

document.getElementById("toggle").addEventListener("click", function() {
  document.getElementById("panel").classList.toggle("open");
});
</script>
</body>
</html>
